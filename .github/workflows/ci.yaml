# See:
# - <https://github.com/tauri-apps/tauri-action>
# - <https://pytauri.github.io/pytauri/latest/usage/tutorial/build-standalone/>

name: Build and Release

on:
  workflow_dispatch:
  push:
    paths:
      - fewshot-char-system/**
      - '.github/workflows/**'

defaults:
  run:
    shell: bash

env:
  directory: fewshot-char-system
  artifact-name: FewshotCharSystem-ci

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-14" # for Intel based macs.
            target: "x86_64-apple-darwin"
          - os: "macos-14" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
          - os: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
          - os: "ubuntu-22.04-arm"
            target: "aarch64-unknown-linux-gnu"
          - os: "windows-2025"
            target: "x86_64-pc-windows-msvc"
          - os: "windows-11-arm"
            target: "aarch64-pc-windows-msvc"
    defaults:
      run:
        working-directory: ${{ env.directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock

      - name: Set up project
        run: bun run setup:ci

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact-name }}-${{ matrix.os }}-${{ github.run_number }}
          path: ${{ env.directory }}/bundle-release/bundle/*
