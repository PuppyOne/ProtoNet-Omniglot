[project]
name = "fewshot-char-system"
version = "0.0.0"
readme = "README.md"

requires-python = "~=3.14.0"

dependencies = [
    "pytauri == 0.8.*",
    "send2trash>=2.1.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.entry-points.pytauri]
ext_mod = "fewshot_char_system.ext_mod"

[build-system]
requires = ["setuptools >= 80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["src-python"] }  

[dependency-groups]
dev = [
    "ruff~=0.15.7",
]

[tool.ruff]
format.quote-style = "single"
line-length = 240
lint.isort.lines-after-imports = 2

lint.select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pyright]
# see: <https://github.com/microsoft/pyright/blob/1.1.391/docs/configuration.md#environment-options>
exclude = [
    "**/node_modules",
    "**/__pycache__",
    
    # it will copy `pyembed` to the target directory (i.e., rust output dir).
    "**/target",

    "**/dist",
    "**/.venv",
    "**/.*",
    "src-tauri/pyembed/",
    "src-tauri/frontend/",
]
