name: Build and Release

on:
  workflow_dispatch:
  push:
    paths:
      - embed-scope/**
      - '.github/workflows/**'
    tags:
      - 'v*'

env:
  directory: embed-scope
  artifact-name: EmbedScope-ci

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    defaults:
      run:
        working-directory: ${{ env.directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/*requirements*.in
            **/*constraints*.txt
            **/*constraints*.in
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock

      - name: Set up project
        run: bun run setup:ci

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact-name }}-${{ matrix.os }}-${{ github.run_number }}
          path: ${{ env.directory }}/dist/*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ github.workspace }}/dist

      - name: Flatten files
        run: |
          mkdir release
          find dist -type f -exec cp {} release/ \;

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release/**/*