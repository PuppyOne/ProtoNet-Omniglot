[project]
name = "embed-scope"
version = "0.0.0"
readme = "README.md"

requires-python = "~=3.14.0"

dependencies = [
    "pyloid==0.27.2",
]

[dependency-groups]
dev = [
    "pyloid-builder~=0.4.1",
    "pyloid-watcher~=0.1.8",
    "ruff~=0.15.7",
]


[tool.ruff]
format.quote-style = "single"
line-length = 240
lint.isort.lines-after-imports = 2

lint.select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]